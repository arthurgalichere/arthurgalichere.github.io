name: Nightly FRED Data Update

on:
  schedule:
    - cron: '30 3 * * 0' # Tells the robot to run every Sunday at 03:30 UTC
  workflow_dispatch: # Gives you a manual button to click if you want to force an update right now

permissions:
  contents: write # Allows the robot to save files back to your repository

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy statsmodels

      - name: Run python fetch_fred_gdp.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_fred_gdp.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of FRED economic data"
