<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div style="width: 100%; max-width: 800px; margin: auto; margin-bottom: 40px;">
  <canvas id="myFredChart"></canvas>
</div>

<div style="width: 100%; max-width: 800px; margin: auto;">
  <canvas id="myCyclesChart"></canvas>
</div>

<script>
fetch('../data/gdp_filtered_data.json')
  .then(response => response.json())
  .then(data => {
    const dates = data.map(item => item.date);
    const gdpValues = data.map(item => item.gdp_value);
    const hpCycles = data.map(item => item.hp_cycle);
    const hamiltonCycles = data.map(item => item.hamilton_cycle);
    const recessions = data.map(item => item.recession);

    // Custom Plugin to draw the grey recession bands in the background
    const recessionPlugin = {
      id: 'recessionPlugin',
      beforeDraw: (chart) => {
        const recData = chart.config.options.recessionData;
        if (!recData) return;
        
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data.length) return;
        
        const ctx = chart.ctx;
        const top = chart.chartArea.top;
        const bottom = chart.chartArea.bottom;

        ctx.save();
        // 2. Make recession bars slightly darker (lower RGB values, slightly higher opacity)
        ctx.fillStyle = 'rgba(150, 150, 150, 0.4)'; 

        let inRecession = false;
        let startX = 0;

        for (let i = 0; i < recData.length; i++) {
          if (recData[i] === 1 && !inRecession) {
            inRecession = true;
            startX = meta.data[i].x; 
          } else if (recData[i] === 0 && inRecession) {
            inRecession = false;
            let endX = meta.data[i].x;
            ctx.fillRect(startX, top, endX - startX, bottom - top);
          }
        }
        
        if (inRecession) {
           let endX = meta.data[recData.length - 1].x;
           ctx.fillRect(startX, top, endX - startX, bottom - top);
        }
        ctx.restore();
      }
    };

    // Shared X-Axis Configuration for both charts
    const sharedXAxisConfig = {
      grid: {
        display: false // 1. Remove vertical grid lines
      },
      title: { display: true, text: 'Date' },
      ticks: {
        autoSkip: false, // Prevents Chart.js from overriding our custom tick logic
        maxRotation: 0,
        // 3. Display only the year, every 5 years, starting from 1950
        callback: function(value) {
          const dateStr = this.getLabelForValue(value);
          if (!dateStr) return null;
          
          const year = parseInt(dateStr.substring(0, 4), 10);
          const month = dateStr.substring(5, 7);
          
          // Check if year >= 1950, is a multiple of 5, and it's the first quarter ('01')
          if (year >= 1950 && year % 5 === 0 && month === '01') {
            return year;
          }
          return null; // Hides ticks for all other dates
        }
      }
    };

    // Chart 1: Raw US GDP
    const ctx1 = document.getElementById('myFredChart').getContext('2d');
    new Chart(ctx1, {
      type: 'line',
      plugins: [recessionPlugin],
      data: {
        labels: dates,
        datasets: [{
          label: 'US Gross Domestic Product',
          data: gdpValues,
          borderColor: '#2b6cb0',
          borderWidth: 2,
          fill: false,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        recessionData: recessions,
        plugins: {
          // 4. Chart title and legend placement
          title: {
            display: true,
            text: 'US Gross Domestic Product (GDP)',
            font: { size: 16 }
          },
          legend: {
            position: 'top',
            align: 'end', // Aligns legend to the top right
            labels: {
              usePointStyle: true,
              pointStyle: 'line'
            }
          }
        },
        scales: {
          x: sharedXAxisConfig,
          y: { title: { display: true, text: 'Billions of Dollars' } }
        }
      }
    });

    // Chart 2: HP Cycle vs. Hamilton Cycle Comparison
    const ctx2 = document.getElementById('myCyclesChart').getContext('2d');
    new Chart(ctx2, {
      type: 'line',
      plugins: [recessionPlugin],
      data: {
        labels: dates,
        datasets: [
          {
            label: 'HP Filter Cycle',
            data: hpCycles,
            borderColor: '#e53e3e',
            borderWidth: 1.5,
            fill: false,
            pointRadius: 0
          },
          {
            label: 'Hamilton Filter Cycle',
            data: hamiltonCycles,
            borderColor: '#319795',
            borderWidth: 1.5,
            fill: false,
            pointRadius: 0
          },
          {
            label: 'Zero Line',
            data: dates.map(() => 0),
            borderColor: '#1a202c',
            borderWidth: 2,
            borderDash: [5, 5],
            fill: false,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        recessionData: recessions,
        plugins: {
          // 4. Chart title and legend placement
          title: {
            display: true,
            text: 'GDP Cyclical Components (HP vs. Hamilton)',
            font: { size: 16 }
          },
          legend: {
            position: 'top',
            align: 'end', // Aligns legend to the top right
            labels: {
              usePointStyle: true,
              pointStyle: 'line',
              filter: function(item, chart) {
                return item.text !== 'Zero Line';
              }
            }
          }
        },
        scales: {
          x: sharedXAxisConfig,
          y: { title: { display: true, text: 'Cyclical Deviation (%)' } }
        }
      }
    });
  });
</script>
